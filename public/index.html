 ctx.fillStyle=pal[0];ctx.fillRect(sx,sy+13,w,h-13);ctx.fillStyle=pal[3];ctx.fillRect(sx+3,sy+16,w-6,h-20);ctx.fillStyle=pal[1];ctx.fillRect(sx+2,sy+13,w-4,2);
 for(let wx=sx+8;wx<sx+w-6;wx+=16){ctx.fillStyle='#263d4b';ctx.fillRect(wx,sy+24,8,12);ctx.fillStyle='#8fc2c0';ctx.fillRect(wx+1,sy+25,6,9);ctx.fillStyle='#d6e7c8';ctx.fillRect(wx+3,sy+25,1,9);ctx.fillStyle='#394d55';ctx.fillRect(wx,sy+29,8,1)}
 const door=sx+w/2-5;ctx.fillStyle='#594536';ctx.fillRect(door-1,sy+h-20,12,20);ctx.fillStyle='#d6b77c';ctx.fillRect(door+1,sy+h-18,8,18);ctx.fillStyle='#fff0bd';ctx.fillRect(door+7,sy+h-10,1,2);ctx.fillStyle='#e8d5a5';ctx.fillRect(sx+3,sy+h-3,w-6,3);ctx.fillStyle='#fff0bd';ctx.fillRect(sx+w/2-1,sy+14,2,2);
}

function drawCampusGate(d,sx,sy){
 ctx.fillStyle='#263a36';ctx.fillRect(sx+4,sy+3,d.w-8,8);
 ctx.fillStyle='#a87945';ctx.fillRect(sx+4,sy+1,7,d.h-1);
 ctx.fillRect(sx+d.w-11,sy+1,7,d.h-1);
 ctx.fillStyle='#e2c17c';ctx.fillRect(sx+2,sy,d.w-4,5);
 ctx.fillRect(sx+4,sy+7,5,3);ctx.fillRect(sx+d.w-9,sy+7,5,3);
 ctx.fillStyle='#6c4935';ctx.fillRect(sx+10,sy+5,d.w-20,3);
}
function drawBuildingSign(d,sx,sy){
 ctx.fillStyle='#63452f';ctx.fillRect(sx-18,sy-7,36,12);ctx.fillStyle='#f4df9c';ctx.fillRect(sx-17,sy-6,34,9);ctx.fillStyle='#57422f';ctx.font='6px monospace';ctx.textAlign='center';ctx.fillText(d.text,sx,sy+1)
}
function drawTree(sx,sy){
 ctx.fillStyle='#6c4b35';ctx.fillRect(sx-2,sy-2,5,11);
 ctx.fillStyle='#2c6845';ctx.fillRect(sx-8,sy-12,16,12);ctx.fillStyle='#438452';ctx.fillRect(sx-6,sy-15,12,9);
 ctx.fillStyle='#75a65d';ctx.fillRect(sx-3,sy-13,4,3);
}
const studentSpriteImage=new Image();
let studentSpriteReady=false;
fetch('/assets/student_sprites.b64').then(r=>{if(!r.ok)throw new Error('sprite atlas missing');return r.text()}).then(b64=>{
 studentSpriteImage.onload=()=>{studentSpriteReady=true;refreshStyleChoices()};
 studentSpriteImage.onerror=()=>{studentSpriteReady=false};
 studentSpriteImage.src='data:image/png;base64,'+b64.trim();
}).catch(()=>{studentSpriteReady=false});
function drawAvatar(a,sx,sy,local){
 const dir=a.dir||'down',key=a.styleKey||((a.gender==='female')?'f1':'m1');
 const flip=dir==='left';
 if(!drawStudentSprite(ctx,key,Math.round(sx-18),Math.round(sy-48),36,48,flip)){
  const look=trainerStyles[key]||trainerStyles.m1;
  drawPixelTrainer(ctx,look,sx-16,sy-40,1,dir,0,a.job||'sword');
 }
 if(local){ctx.fillStyle='#fff0a2';ctx.fillRect(Math.round(sx)-1,Math.round(sy)-51,2,2)}
}
function drawMob(m,sx,sy){
 // Training dummy: outlined straw body, tied headband, wooden arms and feet.
 ctx.fillStyle='#315a3d';ctx.fillRect(sx-9,sy+7,18,3);ctx.fillStyle='#254a35';ctx.fillRect(sx-5,sy+9,10,1);
 ctx.fillStyle='#5b3b29';ctx.fillRect(sx-2,sy-13,4,23);ctx.fillRect(sx-11,sy-8,22,3);
 ctx.fillStyle='#47352c';ctx.fillRect(sx-7,sy-17,14,20);
 ctx.fillStyle='#c49a5e';ctx.fillRect(sx-6,sy-16,12,16);ctx.fillStyle='#e1bd7a';ctx.fillRect(sx-4,sy-14,8,12);
 ctx.fillStyle='#8a633e';ctx.fillRect(sx-7,sy-18,14,4);ctx.fillStyle='#ead39b';ctx.fillRect(sx-5,sy-17,10,2);
 ctx.fillStyle='#6b4a30';ctx.fillRect(sx-10,sy-7,4,3);ctx.fillRect(sx+6,sy-7,4,3);
 ctx.fillStyle='#46352b';ctx.fillRect(sx-3,sy-10,2,2);ctx.fillRect(sx+2,sy-10,2,2);
 ctx.fillStyle='#f1d69b';ctx.fillRect(sx-2,sy-5,4,1);
 ctx.fillStyle='#172d35';ctx.fillRect(sx-9,sy-24,18,4);ctx.fillStyle='#d95e55';ctx.fillRect(sx-8,sy-23,16*Math.max(0,m.hp/m.max),2);
 ctx.fillStyle='#f5e5b4';ctx.fillRect(sx-9,sy-25,18,1);
}
function drawWorld(){
 const camX=Math.max(0,Math.min(MW*T-W,camera.x-W/2)),camY=Math.max(0,Math.min(MH*T-H,camera.y-H/2));camera.sx=camX;camera.sy=camY;
 const sx0=Math.floor(camX/T),sy0=Math.floor(camY/T),sx1=sx0+Math.ceil(W/T)+1,sy1=sy0+Math.ceil(H/T)+1;
 for(let y=sy0;y<sy1;y++)for(let x=sx0;x<sx1;x++)drawTile((map[y]||[])[x]||0,x*T-camX,y*T-camY,x,y);
 // Building signs and campus furniture
 decor.forEach(d=>{let x=d.x-camX,y=d.y-camY;if(x<-100||x>W+100||y<-100||y>H+100)return;if(d.type==='flower'){ctx.fillStyle=d.c;ctx.fillRect(x,y,3,3)}else if(d.type==='building')drawCampusBuilding(d,x,y);else if(d.type==='gate')drawCampusGate(d,x,y)});
 // Training posts, benches and lamp posts
 for(let i=0;i<5;i++){let x=(22+i*7)*T-camX,y=27*T-camY;ctx.fillStyle='#66452e';ctx.fillRect(x-2,y-9,4,17);ctx.fillStyle='#b38b55';ctx.fillRect(x-6,y-10,12,4);ctx.fillStyle='#e1d0a2';ctx.fillRect(x-1,y-8,2,3)}
 // Trees and garden borders
 for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++)if(map[y]&&map[y][x]===3)drawTree(x*T+8-camX,y*T+8-camY);
 // Mobs, drops, players sorted by y
 const actors=[];
 mobs.forEach(m=>{if(m.alive)actors.push({y:m.y,draw:()=>drawMob(m,m.x-camX,m.y-camY)})});
 drops.forEach(d=>actors.push({y:d.y,draw:()=>{ctx.fillStyle='#f4d45e';ctx.fillRect(d.x-camX-3,d.y-camY-3,7,7);ctx.fillStyle='#fff1a8';ctx.fillRect(d.x-camX-1,d.y-camY-2,2,2)}}));
 remotes.forEach(r=>actors.push({y:r.y,draw:()=>drawAvatar(r,r.x-camX,r.y-camY,false)}));
 if(player)actors.push({y:player.y,draw:()=>drawAvatar(player,player.x-camX,player.y-camY,true)});
 actors.sort((a,b)=>a.y-b.y).forEach(a=>a.draw());
 // floating combat numbers
 particles.forEach(p=>{ctx.fillStyle=p.color;ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.fillText(p.text,p.x-camX,p.y-camY-p.life*12)});
}
function attack(skill,slot=0,target=null,fromAuto=false){
 if(!player)return;pendingPickup=null;slot=Math.max(0,Math.min(7,slot|0));
 if(skill?skillCooldown[slot]>0:attackCooldown>0){pendingCombat=null;return}
 const c=jobs[player.job],multipliers=[1.5,1.8,2.2,2.5,1.35,1.7,2.05,2.35],costs=[8,10,13,16,7,11,14,18];
 const range=skill?c.range*(1.12+(slot%4)*.12):c.range+15;
 if(skill&&save.mp<costs[slot]){pendingCombat=null;toast('MP 不足');return}
 if(!target){
  let nearest=Infinity;
  mobs.forEach(m=>{if(!m.alive)return;const d=Math.hypot(m.x-player.x,m.y-player.y);if(d<nearest){nearest=d;target=m}});
 }
 if(!target||!target.alive){pendingCombat=null;say('附近沒有可攻擊的訓練假人');return}
 const distance=Math.hypot(target.x-player.x,target.y-player.y);
 if(distance>range){
  pendingCombat={skill,slot,target,range};
  say('正在接近目標，進入施放距離後自動出招');
  return;
 }
 pendingCombat=null;
 if(skill){save.mp-=costs[slot];skillCooldown[slot]=skillCooldownDuration[slot];updateSkillCooldownUI()}else attackCooldown=.42;
 const damage=c.power*(skill?multipliers[slot]:1);
 const dx=target.x-player.x,dy=target.y-player.y;
 player.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
 target.hp-=damage;target.hit=.18;particles.push({x:target.x,y:target.y-18,text:'-'+Math.round(damage),color:'#fff19a',life:1});
 if(target.hp<=0){target.alive=false;save.xp+=35;save.gold+=8;quest=Math.min(3,quest+1);drops.push({x:target.x,y:target.y,life:20});say('擊倒訓練假人！獲得 35 EXP、8 金幣');if(quest===3){say('任務完成！校園新生訓練結業。');toast('任務完成！')};levelCheck();persist()}
 else say((skill?skillArt[player.job][slot][1]:'普通攻擊')+'命中！');
 if(socket&&socket.connected)socket.emit('combat',{type:skill?'skill':'attack',slot:skill?slot:undefined});
 updateUI();
}
function levelCheck(){while(save.xp>=save.level*100){save.xp-=save.level*100;save.level++;let m=statMax();save.hp=m.hp;save.mp=m.mp;say('升級！目前 Lv.'+save.level);toast('LEVEL UP! Lv.'+save.level)}}
function pickup(target=null){
 if(!player)return;pendingCombat=null;
 if(!target){let nearest=Infinity;for(const d of drops){const distance=Math.hypot(d.x-player.x,d.y-player.y);if(distance<nearest){nearest=distance;target=d}}}
 if(!target||!drops.includes(target)){pendingPickup=null;say('附近沒有可拾取物品');return}
 const distance=Math.hypot(target.x-player.x,target.y-player.y);
 if(distance>=26){pendingPickup=target;say('正在接近補給品，靠近後自動拾取');return}
 pendingPickup=null;drops.splice(drops.indexOf(target),1);save.gold+=5;say('拾取補給品：+5 金幣');updateUI();persist()
}
function rest(){if(!player)return;let m=statMax();save.hp=Math.min(m.hp,save.hp+25);save.mp=Math.min(m.mp,save.mp+20);say('原地調息，恢復生命與法力。');updateUI()}
function update(dt){
 if(!player)return;
 if(transitionLock>0)transitionLock=Math.max(0,transitionLock-dt);
 let dx=touch.x,dy=touch.y;
 if(keys.ArrowUp||keys.w)dy-=1;if(keys.ArrowDown||keys.s)dy+=1;if(keys.ArrowLeft||keys.a)dx-=1;if(keys.ArrowRight||keys.d)dx+=1;
 // 僅允許四方向：選擇輸入較大的軸，絕不斜向移動。
 if(Math.abs(dx)>Math.abs(dy))dy=0;else dx=0;
 const magnitude=Math.min(1,Math.hypot(dx,dy));
 if(magnitude>.12){pendingCombat=null;pendingPickup=null;let l=Math.hypot(dx,dy);move(dx/l*48*magnitude*dt,dy/l*48*magnitude*dt);checkMapGate()}
 if(pendingCombat){
  const p=pendingCombat,t=p.target;
  if(!t||!t.alive){pendingCombat=null}
  else{
   const tx=t.x-player.x,ty=t.y-player.y,dist=Math.hypot(tx,ty);
   if(dist<=p.range){pendingCombat=null;attack(p.skill,p.slot,t,true)}
   else{
    const step=Math.min(48*dt,Math.max(0,dist-p.range+1));
    if(Math.abs(tx)>Math.abs(ty)){player.dir=tx>0?'right':'left';move(Math.sign(tx)*step,0)}
    else{player.dir=ty>0?'down':'up';move(0,Math.sign(ty)*step)}
   }
  }
 }
 if(pendingPickup){
  const d=pendingPickup;
  if(!drops.includes(d)){pendingPickup=null}
  else{
   const tx=d.x-player.x,ty=d.y-player.y,dist=Math.hypot(tx,ty);
   if(dist<26){pickup(d)}
   else{
    const step=Math.min(48*dt,Math.max(0,dist-24));
    if(Math.abs(tx)>Math.abs(ty)){player.dir=tx>0?'right':'left';move(Math.sign(tx)*step,0)}
    else{player.dir=ty>0?'down':'up';move(0,Math.sign(ty)*step)}
   }
  }
 }
 if(attackCooldown>0)attackCooldown-=dt;for(let i=0;i<8;i++)if(skillCooldown[i]>0)skillCooldown[i]=Math.max(0,skillCooldown[i]-dt);updateSkillCooldownUI();
 mobs.forEach(m=>{if(!m.alive)return;m.phase+=dt;if(Math.hypot(m.x-player.x,m.y-player.y)<21&&Math.random()<dt*.35){save.hp=Math.max(0,save.hp-3);if(save.hp===0){let c=jobs[player.job];save.hp=c.hp;player.x=MW*T/2;player.y=15*T;say('體力耗盡，已返回學院門口。');toast('返回廣場')}updateUI()}});
 drops.forEach(d=>d.life-=dt);drops=drops.filter(d=>d.life>0);
 remotes.forEach(r=>{if(r.tx!==undefined){r.x+=(r.tx-r.x)*Math.min(1,dt*12);r.y+=(r.ty-r.y)*Math.min(1,dt*12)}r.frame+=dt*7});
 particles.forEach(p=>p.life-=dt);particles=particles.filter(p=>p.life>0);
 if(socket&&socket.connected){player.send=(player.send||0)+dt;if(player.send>.1){player.send=0;socket.emit('move',{x:player.x/T,z:player.y/T,rot:0})}}
 camera.x+=(player.x-camera.x)*Math.min(1,dt*8);camera.y+=(player.y-camera.y)*Math.min(1,dt*8);
 if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').style.opacity=0}
}
function render(){
 ctx.clearRect(0,0,W,H);drawWorld();
 // GBC-style bottom location plaque
 ctx.fillStyle='#18333cdd';ctx.fillRect(112,220,96,14);ctx.strokeStyle='#d5c18a';ctx.strokeRect(112.5,220.5,95,13);
 ctx.fillStyle='#f6e7b7';ctx.font='8px monospace';ctx.textAlign='center';ctx.fillText(mapNames[currentMap],160,230);
}
function loop(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);render();requestAnimationFrame(loop)}
function bindHold(el,fn){el.addEventListener('pointerdown',e=>{e.preventDefault();fn(true)});['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();fn(false)}))}
const joy=$('joystick'),stick=$('stick');let joyPointer=null,joyRect=null;
function updateJoy(e){
 if(!joyRect)return;const cx=joyRect.left+joyRect.width/2,cy=joyRect.top+joyRect.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy,limit=joyRect.width*.34,len=Math.hypot(dx,dy);
 if(len>limit){dx=dx/len*limit;dy=dy/len*limit}
 // 搖桿吸附到最近的上、下、左、右方向。
 if(Math.max(Math.abs(dx),Math.abs(dy))<8){dx=0;dy=0}
 else if(Math.abs(dx)>Math.abs(dy)){dx=Math.sign(dx)*Math.min(limit,Math.abs(dx));dy=0}
 else{dy=Math.sign(dy)*Math.min(limit,Math.abs(dy));dx=0}
 touch.x=dx/limit;touch.y=dy/limit;
 stick.style.transform='translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px))';
}
function resetJoy(){joyPointer=null;joyRect=null;touch.x=0;touch.y=0;stick.style.transform='translate(-50%,-50%)'}
joy.addEventListener('pointerdown',e=>{e.preventDefault();joyPointer=e.pointerId;joyRect=joy.getBoundingClientRect();joy.setPointerCapture(e.pointerId);updateJoy(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer){e.preventDefault();updateJoy(e)}});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>joy.addEventListener(ev,e=>{if(e.pointerId===joyPointer)resetJoy()}));
$('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack(false)});
let skillGesture=null;
[1,2,3,4].forEach(n=>{
 const el=$('skill'+n);
 el.addEventListener('pointerdown',e=>{e.preventDefault();skillGesture={id:e.pointerId,x:e.clientX,y:e.clientY,slot:n-1};el.setPointerCapture(e.pointerId)});
 el.addEventListener('pointerup',e=>{
  if(!skillGesture||e.pointerId!==skillGesture.id)return;
  const dx=e.clientX-skillGesture.x,dy=e.clientY-skillGesture.y;
  if(dx>28&&dy< -24&&Math.hypot(dx,dy)>42)toggleSkillPage();
  else attack(true,skillPage*4+n-1);
  skillGesture=null;
 });
 el.addEventListener('pointercancel',()=>{skillGesture=null});
});
$('skillPageToggle').addEventListener('pointerdown',e=>{e.preventDefault();toggleSkillPage()});
const swipeArea=$('skillSwipeArea');let swipeStart=null;
swipeArea.addEventListener('pointerdown',e=>{e.preventDefault();swipeStart={x:e.clientX,y:e.clientY,id:e.pointerId};swipeArea.setPointerCapture(e.pointerId)});
swipeArea.addEventListener('pointerup',e=>{if(!swipeStart||e.pointerId!==swipeStart.id)return;const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;if(dx>28&&dy< -24&&Math.hypot(dx,dy)>42)toggleSkillPage();swipeStart=null});
swipeArea.addEventListener('pointercancel',()=>{swipeStart=null});
$('rest').addEventListener('pointerdown',e=>{e.preventDefault();rest()});
$('pickup').addEventListener('pointerdown',e=>{e.preventDefault();pickup()});
$('gender').addEventListener('change',refreshStyleChoices);refreshStyleChoices();
 $('start').onclick=start;
addEventListener('keydown',e=>{keys[e.key]=true;keys[e.key.toLowerCase()]=true;if(e.key==='j'||e.key===' '){e.preventDefault();attack(false)}if(e.key==='k')attack(true,skillPage*4);if(e.key==='e')pickup()});
addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false});
document.addEventListener('contextmenu',e=>e.preventDefault());
initMap(0);$('right').querySelector('strong').textContent=mapNames[0];requestAnimationFrame(loop);
})();
</script>
