<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#172b38">
<title>校園傳說 Online 2D — GBC 像素冒險</title>
<style>
:root{color-scheme:dark;--ink:#f5edcf;--panel:#203b48;--edge:#d9c68b;--gold:#f2d47b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172b38;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;touch-action:none}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#101e28}
canvas{display:block;width:100vw;height:100vh;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;background:#6a9b62}
.panel{background:linear-gradient(#315565,#1d3946);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px #132b35,0 4px 0 #10232b;border-radius:5px}
#hud{position:fixed;left:8px;top:8px;width:min(265px,66vw);padding:8px 10px;z-index:2;pointer-events:none;text-shadow:1px 1px #172b38}
#brand{font-weight:950;font-size:14px;letter-spacing:1px;color:#ffe9a7}
#stats{font-size:11px;display:flex;justify-content:space-between;gap:8px;margin-top:3px}
.bar{height:7px;background:#142c37;border:1px solid #8b9c85;margin:3px 0 4px}.fill{height:100%;width:100%}#hp{background:#e75e62}#mp{background:#60b7dc}#xp{background:#f0cb61}
.small{font-size:10px;color:#e3e0c7}
#right{position:fixed;right:8px;top:8px;width:155px;padding:8px;z-index:2;font-size:11px}
#right strong{color:#ffe9a7}
#quest{margin-top:6px;color:#dce8ba}
#log{position:fixed;left:8px;bottom:8px;width:min(310px,66vw);height:75px;padding:6px 8px;font-size:10px;line-height:1.45;overflow:hidden;z-index:2;pointer-events:none;background:#183541eF}
#combatCluster{position:fixed;right:10px;bottom:10px;width:224px;height:238px;z-index:4;pointer-events:none;user-select:none}
#skillSwipeArea{position:absolute;inset:0;z-index:0;pointer-events:auto;touch-action:none}
#combatCluster button{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;border-radius:50%;font-weight:900;line-height:1.05;touch-action:none;pointer-events:auto;text-shadow:1px 2px 2px #101c28;isolation:isolate;z-index:2}
#combatCluster button b{font-size:22px;color:#fff4d4;line-height:1}
#combatCluster button span{font-size:8px;white-space:nowrap;color:#fff5d8}
#attack{left:145px;bottom:55px;width:72px;height:72px;border:3px solid #ffe29a;background:radial-gradient(circle at 34% 25%,#ffce78 0 10%,#e77b3f 42%,#a83d32 76%,#54252b);box-shadow:0 5px 0 #3a2020,inset 0 0 0 3px #7c4132,0 0 13px #f39c4b66}
#attack b{font-size:29px!important}
.skill{width:50px;height:50px;border:2px solid #d9e9ff;background:radial-gradient(circle at 32% 24%,#a9d9ee 0 7%,#527eaa 40%,#263f68 76%,#14263e);box-shadow:0 4px 0 #10232b,inset 0 0 0 2px #a8c7df55,0 0 0 2px #172c42;transition:filter .08s,transform .08s}
.skill:before{content:"";position:absolute;inset:4px;border:1px solid #ffffff66;border-radius:50%;pointer-events:none}
.skill:active{filter:brightness(1.35);transform:scale(.94)}
#skill1{left:42px;bottom:66px}#skill2{left:57px;bottom:130px}#skill3{left:105px;bottom:177px}#skill4{left:169px;bottom:180px}
.utility{width:38px;height:38px;border:2px solid #d8c58e;background:radial-gradient(circle at 35% 28%,#8ba68a,#3d655c 75%,#25433e);box-shadow:0 3px 0 #10232b}
#rest{left:91px;bottom:10px}#pickup{left:177px;bottom:128px}
#skillPageToggle{left:4px;top:4px;width:58px;height:22px;border:1px solid #e3d09a;border-radius:12px;padding:1px 4px;font-size:9px;background:#193744eF;color:#fff0bd;box-shadow:0 2px 0 #0c2029}
#combatCluster .skill.cooling{filter:grayscale(.75) brightness(.72)}
#combatCluster .skill.cooling:after{content:attr(data-cooldown);position:absolute;inset:0;display:grid;place-items:center;border-radius:50%;background:conic-gradient(#101923e8 var(--cooldown-progress),#10192335 0);color:#fff;font-size:15px;font-weight:900;text-shadow:0 1px 2px #000;box-shadow:inset 0 0 0 3px #ffffff35;pointer-events:none}
button,select,input{font:inherit;color:#fff4d0;background:#315565;border:2px solid #d9c68b;border-radius:4px;padding:8px 10px}
button{font-weight:800;box-shadow:0 3px 0 #102630;touch-action:none}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #102630;background:#557b75}
#joystick{position:fixed;left:16px;bottom:16px;width:132px;height:132px;border:3px solid #d9c68b;border-radius:50%;background:radial-gradient(circle,#426b68aa 0 42%,#1a3544cc 70%);box-shadow:inset 0 0 0 3px #142c37,0 4px 0 #10232b;z-index:4;touch-action:none;user-select:none}
#joystick:before,#joystick:after{content:"";position:absolute;background:#d9c68b55;pointer-events:none}
#joystick:before{left:50%;top:9px;bottom:9px;width:1px}
#joystick:after{top:50%;left:9px;right:9px;height:1px}
#stick{position:absolute;left:50%;top:50%;width:54px;height:54px;border:3px solid #f3dda0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f1d58b,#986b43 72%,#593f32);box-shadow:0 3px 0 #142630,inset 0 0 0 2px #d7b979;transform:translate(-50%,-50%);pointer-events:none}
#joyHint{position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);font-size:9px;color:#fff0c9;white-space:nowrap;text-shadow:1px 1px #142b34;pointer-events:none}
#login{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at center,#456d62dd,#10242eee)}
#login .card{width:min(430px,100%);padding:18px 20px}
h1{margin:0;color:#ffe9a7;font-size:24px;text-shadow:2px 2px #142b34}
p{font-size:12px;line-height:1.55;color:#e2e4cc}
label{display:block;font-size:12px;margin:10px 0 4px;color:#ffe9a7}
input,select{width:100%;padding:9px}
#start{width:100%;margin-top:14px;background:#8b583e;font-size:15px}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:8;padding:8px 14px;background:#142f3beF;border:2px solid #f0d68d;border-radius:4px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
#help{position:fixed;right:8px;bottom:8px;font-size:10px;color:#fff0c9;z-index:2;text-align:right;pointer-events:none}
@media(min-width:800px){#joystick{left:22px;bottom:22px;width:148px;height:148px}#stick{width:60px;height:60px}#combatCluster{right:22px;bottom:22px}#log{left:12px;bottom:12px}#hud{left:12px;top:12px}#right{right:12px;top:12px}}
@media(max-width:520px){#right{width:130px;font-size:10px}#hud{width:59vw;padding:6px 8px}#brand{font-size:12px}#log{width:58vw;height:58px;font-size:9px;bottom:155px}#combatCluster{right:4px;bottom:5px;width:204px;height:220px}#combatCluster button b{font-size:17px}#combatCluster button span{font-size:7px}#attack{left:133px;bottom:50px;width:66px;height:66px}#attack b{font-size:25px!important}.skill{width:46px;height:46px}#skill1{left:40px;bottom:60px}#skill2{left:52px;bottom:118px}#skill3{left:96px;bottom:166px}#skill4{left:153px;bottom:168px}.utility{width:36px;height:36px}#rest{left:96px;bottom:8px}#pickup{left:166px;bottom:112px}#skillPageToggle{left:3px;top:3px;width:54px;height:21px;font-size:8px}#combatCluster .skill.cooling:after{font-size:13px}#joystick{left:9px;bottom:13px;width:104px;height:104px}#stick{width:44px;height:44px}#help{display:none}}
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="320" height="240" aria-label="校園傳說 Online 2D 遊戲畫面"></canvas></div>
<div id="hud" class="panel">
 <div id="brand">校園傳說 ONLINE <span class="small">2D</span></div>
 <div class="small" id="who">尚未登入</div>
 <div id="stats"><span id="lv">Lv.1</span><span id="job">劍道部</span><span id="pos">0,0</span></div>
 <div class="small">HP <span id="hpText">100/100</span></div><div class="bar"><div class="fill" id="hp"></div></div>
 <div class="small">MP <span id="mpText">50/50</span></div><div class="bar"><div class="fill" id="mp"></div></div>
 <div class="small">EXP <span id="xpText">0/100</span></div><div class="bar"><div class="fill" id="xp"></div></div>
 <div class="small" id="gold">金幣 0</div>
</div>
<div id="right" class="panel">
 <strong>學園廣場</strong><div class="small" id="net">單人模式</div>
 <div class="small" style="margin-top:6px">附近玩家</div><div id="players" class="small">目前沒有其他玩家</div>
 <div id="quest">任務：擊倒訓練假人 0/3</div>
 <div class="small" id="clock">早上 08:00</div>
</div>
<div id="log" class="panel">歡迎來到校園傳說 Online！</div>
<div id="toast"></div>
<div id="joystick" aria-label="虛擬搖桿，拖曳控制角色移動">
 <div id="stick"></div><div id="joyHint">移動搖桿</div>
</div>
<div id="combatCluster" aria-label="戰鬥操作區">
 <div id="skillSwipeArea" aria-label="向右上滑動切換技能頁"></div>
 <button id="skillPageToggle" aria-label="切換技能頁">1 / 2 ↗</button>
 <button class="skill" id="skill1" aria-label="技能一"><b>⚔</b><span>技能1</span></button>
 <button class="skill" id="skill2" aria-label="技能二"><b>✦</b><span>技能2</span></button>
 <button class="skill" id="skill3" aria-label="技能三"><b>➤</b><span>技能3</span></button>
 <button class="skill" id="skill4" aria-label="技能四"><b>✹</b><span>技能4</span></button>
 <button class="utility" id="rest" aria-label="恢復"><b>✚</b><span>恢復</span></button>
 <button class="utility" id="pickup" aria-label="拾取"><b>＋</b><span>拾取</span></button>
 <button id="attack" aria-label="普通攻擊"><b>⚔</b><span>攻擊</span></button>
</div>
<div id="help">拖曳左下搖桿移動　J攻擊　K技能　E拾取</div>
<div id="login">
 <div class="card panel">
  <h1>校園傳說 Online</h1>
  <div style="color:#f4d98c;font-size:12px;font-weight:800">2D CLASSIC PIXEL ADVENTURE</div>
  <p>踏入熟悉的校園，選擇你的社團職業，探索廣場、挑戰訓練假人並提升等級。</p>
  <label>角色名稱</label><input id="name" maxlength="12" value="新生玩家">
  <label>性別</label><select id="gender"><option value="male">男性</option><option value="female">女性</option></select>
  <label>選擇職業</label><select id="class"><option value="sword">劍道部｜均衡近戰</option><option value="fighter">格鬥部｜近身爆發</option><option value="archer">弓箭部｜遠程攻擊</option><option value="psy">氣功部｜氣功術法</option></select>
  <button id="start">進入學園</button>
  <p class="small">支援 Android 手機觸控。可離線單人遊玩；啟動伺服器後可同步其他在線玩家。</p>
 </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
(function(){
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
ctx.imageSmoothingEnabled=false;
const W=320,H=240,T=16;let MW=40,MH=30;
const $=id=>document.getElementById(id);
const jobs={
 sword:{name:'劍道部',hp:120,mp:45,power:20,range:30,color:'#d34d45',skill:'拔刀斬'},
 fighter:{name:'格鬥部',hp:135,mp:35,power:24,range:24,color:'#d98b3c',skill:'旋風拳'},
 archer:{name:'弓箭部',hp:98,mp:65,power:17,range:100,color:'#4c9c62',skill:'穿透箭'},
 psy:{name:'氣功部',hp:105,mp:85,power:16,range:92,color:'#9271cb',skill:'氣功波'}
};
const skillArt={
 sword:[['⚔','拔刀斬'],['✦','連環斬'],['➤','劍氣波'],['✹','破空斬'],['▣','格擋'],['➶','突進斬'],['✧','劍影'],['☄','劍舞']],
 fighter:[['✊','重拳'],['✦','連打'],['✹','旋風拳'],['☄','爆裂擊'],['▣','鐵布衫'],['➤','衝拳'],['◉','震地'],['✧','狂怒']],
 archer:[['➶','速射'],['➤','穿透箭'],['✧','箭雨'],['◎','狙擊'],['▣','翻滾'],['➹','連珠箭'],['✦','束縛箭'],['☄','風暴箭']],
 psy:[['✧','氣彈'],['◉','念力波'],['✹','氣旋'],['☯','氣功爆發'],['▣','護盾'],['➤','靈波'],['❖','封印'],['☄','星隕']]
};
let skillPage=0;
function applySkillArt(){
 const art=skillArt[player.job],offset=skillPage*4;
 art.slice(offset,offset+4).forEach((item,i)=>{
  const button=$('skill'+(i+1));
  button.querySelector('b').textContent=item[0];
  button.querySelector('span').textContent=item[1];
  button.setAttribute('aria-label','技能'+(offset+i+1)+' '+item[1]);
  button.dataset.skill=String(offset+i);
 });
 $('skillPageToggle').textContent=(skillPage+1)+' / 2 ↗';
 $('skillPageToggle').setAttribute('aria-label','切換至技能頁 '+(skillPage===0?'2':'1'));
 updateSkillCooldownUI();
}
function toggleSkillPage(){skillPage=skillPage===0?1:0;if(player)applySkillArt();else $('skillPageToggle').textContent=(skillPage+1)+' / 2 ↗';}
function updateSkillCooldownUI(){
 for(let i=0;i<4;i++){
  const slot=skillPage*4+i,button=$('skill'+(i+1)),left=skillCooldown[slot]||0;
  button.classList.toggle('cooling',left>0);
  if(left>0){button.dataset.cooldown=Math.ceil(left);button.style.setProperty('--cooldown-progress',(left/skillCooldownDuration[slot]*360)+'deg')}
  else{delete button.dataset.cooldown;button.style.removeProperty('--cooldown-progress')}
 }
}
let map=[],obstacles=[],decor=[],mobs=[],drops=[],remotes=new Map(),keys={},touch={x:0,y:0},player=null,socket=null,playerId=null;
const mapNames=['學園廣場','劍道館','社團森林','後山修練場'];let currentMap=0,transitionLock=0;
const skillCooldownDuration=[1.1,1.8,2.8,4.2,1.4,2.1,3.1,4.6];
let last=0,attackCooldown=0,skillCooldown=Array(8).fill(0),toastTimer=0,logLines=[],camera={x:0,y:0},quest=0;
let save={level:1,xp:0,gold:0,hp:100,mp:50};
let particles=[],pendingCombat=null,pendingPickup=null;
const rand=(x,y)=>{let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};
function tile(x,y,v){if(x>=0&&y>=0&&x<MW&&y<MH)map[y][x]=v}
function rectTiles(x,y,w,h,v){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)tile(i,j,v)}
function block(x,y,w,h){obstacles.push({x:x*T,y:y*T,w:w*T,h:h*T})}
function initMap(zone=currentMap){
 currentMap=zone;MW=40;MH=30;map=Array.from({length:MH},()=>Array(MW).fill(0));obstacles=[];decor=[];
 rectTiles(0,0,MW,1,3);rectTiles(0,MH-1,MW,1,3);rectTiles(0,0,1,MH,3);rectTiles(MW-1,0,1,MH,3);
 if(zone===0){
  rectTiles(2,2,36,26,0);rectTiles(2,13,36,4,1);rectTiles(18,2,4,26,1);
  [[5,4,9,6],[26,4,9,6],[5,20,9,6],[26,20,9,6]].forEach(q=>{rectTiles(q[0],q[1],q[2],q[3],2);block(q[0]*T,q[1]*T,q[2]*T,q[3]*T)});
  decor.push({x:9*T,y:7*T,type:'sign',text:'劍道館'},{x:30*T,y:7*T,type:'sign',text:'社團大樓'},{x:9*T,y:23*T,type:'sign',text:'教學大樓'},{x:30*T,y:23*T,type:'sign',text:'圖書館'});
  rectTiles(3,5,3,3,4);rectTiles(34,20,3,3,5);
 }else if(zone===1){
  rectTiles(2,2,36,26,0);rectTiles(3,4,34,22,1);
  [[5,6,7,5],[28,6,7,5],[5,19,7,5],[28,19,7,5]].forEach(q=>{rectTiles(q[0],q[1],q[2],q[3],2);block(q[0]*T,q[1]*T,q[2]*T,q[3]*T)});
  decor.push({x:20*T,y:8*T,type:'sign',text:'劍道修練場'});
 }else if(zone===2){
  rectTiles(2,2,36,26,0);rectTiles(4,13,32,4,1);rectTiles(18,3,4,24,1);
  for(let y=4;y<26;y+=4)for(let x=4+(y%8);x<36;x+=7)if(x<17||x>22)tile(x,y,3);
  rectTiles(6,5,4,3,4);rectTiles(29,21,4,3,4);decor.push({x:20*T,y:10*T,type:'sign',text:'森林深處'});
 }else{
  rectTiles(2,2,36,26,0);rectTiles(3,4,34,22,1);rectTiles(7,6,5,4,4);rectTiles(28,20,5,4,4);
  for(let x=6;x<35;x+=5){tile(x,7,3);tile(x,22,3)}decor.push({x:20*T,y:9*T,type:'sign',text:'後山修練場'});
 }
 if(zone===0){tile(38,14,6);tile(1,14,6);tile(20,1,6);tile(20,28,6)}
 else if(zone===1)tile(20,1,6);else if(zone===2)tile(1,14,6);else tile(20,28,6);
 for(let y=2;y<MH-2;y++)for(let x=2;x<MW-2;x++)if(map[y][x]===0&&rand(x,y+zone*100)>.985)decor.push({x:x*T+8,y:y*T+8,type:'flower',c:rand(x+5,y)>0.5?'#f4d47a':'#eaa0a4'});
}
function enterMap(zone,sx,sy){
 if(transitionLock>0)return;initMap(zone);initMobs();drops=[];pendingCombat=null;pendingPickup=null;
 player.x=sx*T+8;player.y=sy*T+8;player.dir='down';camera.x=player.x;camera.y=player.y;
 $('right').querySelector('strong').textContent=mapNames[zone];say('進入地圖：'+mapNames[zone]);toast('抵達 '+mapNames[zone]);transitionLock=.8;updateUI();
}
function checkMapGate(){
 if(!player||transitionLock>0)return;const x=Math.floor(player.x/T),y=Math.floor(player.y/T);if((map[y]||[])[x]!==6)return;
 if(currentMap===0){if(x>=37)enterMap(2,3,14);else if(x<=2)enterMap(1,20,3);else if(y<=2)enterMap(3,20,26);else if(y>=27)enterMap(3,20,3)}
 else if(currentMap===1)enterMap(0,4,14);else if(currentMap===2)enterMap(0,36,14);else enterMap(0,20,4);
}
function say(s){logLines.unshift(s);logLines=logLines.slice(0,5);$('log').innerHTML=logLines.map(x=>'› '+x).join('<br>')}
function toast(s){$('toast').textContent=s;$('toast').style.opacity=1;toastTimer=1.6}
function statMax(){const c=jobs[player.job];return {hp:c.hp+(save.level-1)*8,mp:c.mp+(save.level-1)*5}}
function updateUI(){
 if(!player)return;const c=jobs[player.job],m=statMax();
 $('who').textContent=player.name+'｜'+(player.gender==='female'?'女':'男');
 $('lv').textContent='Lv.'+save.level;$('job').textContent=c.name;
 $('hpText').textContent=Math.ceil(save.hp)+'/'+m.hp;$('mpText').textContent=Math.ceil(save.mp)+'/'+m.mp;
 $('xpText').textContent=save.xp+'/'+(save.level*100);$('gold').textContent='金幣 '+save.gold;
 $('hp').style.width=(100*save.hp/m.hp)+'%';$('mp').style.width=(100*save.mp/m.mp)+'%';$('xp').style.width=(100*save.xp/(save.level*100))+'%';
 $('quest').textContent='任務：擊倒訓練假人 '+quest+'/3';
 $('pos').textContent=Math.floor(player.x/T)+','+Math.floor(player.y/T);
}
function persist(){try{localStorage.setItem('campus2d-save',JSON.stringify({level:save.level,xp:save.xp,gold:save.gold,quest:quest}))}catch(e){}}
function loadSave(){try{let s=JSON.parse(localStorage.getItem('campus2d-save')||'{}');save.level=Math.max(1,s.level||1);save.xp=s.xp||0;save.gold=s.gold||0;quest=s.quest||0}catch(e){}}
function start(){
 loadSave();const job=$('class').value,gender=$('gender').value,name=$('name').value.trim()||'新生玩家',c=jobs[job];
 player={id:'local',name,job,gender,x:20*T+8,y:16*T,dir:'down',frame:0,walk:0,flash:0};applySkillArt();
 save.hp=c.hp+(save.level-1)*8;save.mp=c.mp+(save.level-1)*5;

function collides(x,y){

 if(x<T+5||y<T+5||x>(MW-1)*T-5||y>(MH-1)*T-5)return true;
 for(const b of obstacles)if(r.x<b.x+b.w&&r.x+r.w>b.x&&r.y<b.y+b.h&&r.y+r.h>b.y)return true;
 for(let yy=Math.floor((y-5)/T);yy<=Math.floor((y+5)/T);yy++)for(let xx=Math.floor((x-5)/T);xx<=Math.floor((x+5)/T);xx++){
  const v=(map[yy]||[])[xx];if(v===3||v===4||v===5)return true;
 }

}

function attack(skill,slot=0,target=null,fromAuto=false){

 const c=jobs[player.job],multipliers=[1.5,1.8,2.2,2.5,1.35,1.7,2.05,2.35],costs=[8,10,13,16,7,11,14,18];
 const range=skill?c.range*(1.12+(slot%4)*.12):c.range+15;
 if(skill&&save.mp<costs[slot]){pendingCombat=null;toast('MP 不足');return}
 if(!target){
  let nearest=Infinity;
  mobs.forEach(m=>{if(!m.alive)return;const d=Math.hypot(m.x-player.x,m.y-player.y);if(d<nearest){nearest=d;target=m}});
 }
 if(!target||!target.alive){pendingCombat=null;say('附近沒有可攻擊的訓練假人');return}
 const distance=Math.hypot(target.x-player.x,target.y-player.y);

 }

 const damage=c.power*(skill?multipliers[slot]:1);

 target.hp-=damage;target.hit=.18;particles.push({x:target.x,y:target.y-18,text:'-'+Math.round(damage),color:'#fff19a',life:1});
 if(target.hp<=0){target.alive=false;save.xp+=35;save.gold+=8;quest=Math.min(3,quest+1);drops.push({x:target.x,y:target.y,life:20});say('擊倒訓練假人！獲得 35 EXP、8 金幣');if(quest===3){say('任務完成！校園新生訓練結業。');toast('任務完成！')};levelCheck();persist()}

function pickup(target=null){

 if(!target||!drops.includes(target)){pendingPickup=null;say('附近沒有可拾取物品');return}

 if(distance>=26){pendingPickup=target;say('正在接近補給品，靠近後自動拾取');return}

function update(dt){
 if(!player)return;
 if(transitionLock>0)transitionLock=Math.max(0,transitionLock-dt);
 let dx=touch.x,dy=touch.y;
 if(keys.ArrowUp||keys.w)dy-=1;if(keys.ArrowDown||keys.s)dy+=1;if(keys.ArrowLeft||keys.a)dx-=1;if(keys.ArrowRight||keys.d)dx+=1;
 // 僅允許四方向：選擇輸入較大的軸，絕不斜向移動。
 if(Math.abs(dx)>Math.abs(dy))dy=0;else dx=0;
 const magnitude=Math.min(1,Math.hypot(dx,dy));
 if(magnitude>.12){pendingCombat=null;pendingPickup=null;let l=Math.hypot(dx,dy);move(dx/l*48*magnitude*dt,dy/l*48*magnitude*dt);checkMapGate()}
 if(pendingCombat){
  const p=pendingCombat,t=p.target;
  if(!t||!t.alive){pendingCombat=null}
  else{
   const tx=t.x-player.x,ty=t.y-player.y,dist=Math.hypot(tx,ty);
   if(dist<=p.range){pendingCombat=null;attack(p.skill,p.slot,t,true)}
   else{
    const step=Math.min(48*dt,Math.max(0,dist-p.range+1));
    if(Math.abs(tx)>Math.abs(ty)){player.dir=tx>0?'right':'left';move(Math.sign(tx)*step,0)}
    else{player.dir=ty>0?'down':'up';move(0,Math.sign(ty)*step)}
   }
  }
 }
 if(pendingPickup){
  const d=pendingPickup;
  if(!drops.includes(d)){pendingPickup=null}
  else{
   const tx=d.x-player.x,ty=d.y-player.y,dist=Math.hypot(tx,ty);
   if(dist<26){pickup(d)}
   else{
    const step=Math.min(48*dt,Math.max(0,dist-24));
    if(Math.abs(tx)>Math.abs(ty)){player.dir=tx>0?'right':'left';move(Math.sign(tx)*step,0)}
    else{player.dir=ty>0?'down':'up';move(0,Math.sign(ty)*step)}
   }
  }
 }
 if(attackCooldown>0)attackCooldown-=dt;for(let i=0;i<8;i++)if(skillCooldown[i]>0)skillCooldown[i]=Math.max(0,skillCooldown[i]-dt);updateSkillCooldownUI();
 mobs.forEach(m=>{if(!m.alive)return;m.phase+=dt;if(Math.hypot(m.x-player.x,m.y-player.y)<21&&Math.random()<dt*.35){save.hp=Math.max(0,save.hp-3);if(save.hp===0){let c=jobs[player.job];save.hp=c.hp;player.x=MW*T/2;player.y=29*T;say('體力耗盡，已返回學園廣場。');toast('返回廣場')}updateUI()}});
 drops.forEach(d=>d.life-=dt);drops=drops.filter(d=>d.life>0);
 remotes.forEach(r=>{if(r.tx!==undefined){r.x+=(r.tx-r.x)*Math.min(1,dt*12);r.y+=(r.ty-r.y)*Math.min(1,dt*12)}r.frame+=dt*7});
 particles.forEach(p=>p.life-=dt);particles=particles.filter(p=>p.life>0);
 if(socket&&socket.connected){player.send=(player.send||0)+dt;if(player.send>.1){player.send=0;socket.emit('move',{x:player.x/T,z:player.y/T,rot:0})}}
 camera.x+=(player.x-camera.x)*Math.min(1,dt*8);camera.y+=(player.y-camera.y)*Math.min(1,dt*8);
 if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').style.opacity=0}
}

function updateJoy(e){

 let dx=e.clientX-cx,dy=e.clientY-cy,limit=joyRect.width*.34,len=Math.hypot(dx,dy);
 if(len>limit){dx=dx/len*limit;dy=dy/len*limit}
 // 搖桿吸附到最近的上、下、左、右方向。
 if(Math.max(Math.abs(dx),Math.abs(dy))<8){dx=0;dy=0}
 else if(Math.abs(dx)>Math.abs(dy)){dx=Math.sign(dx)*Math.min(limit,Math.abs(dx));dy=0}
 else{dy=Math.sign(dy)*Math.min(limit,Math.abs(dy));dx=0}
 touch.x=dx/limit;touch.y=dy/limit;
 stick.style.transform='translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px))';
}
